name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 9:00 AM UTC
    - cron: '0 9 */3 * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/tickets?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"